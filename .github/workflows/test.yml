name: test

# test-plan.md §CI placement: "On every PR: unit, component, contract and integration."
# e2e (`pnpm test:e2e`, a production build against a throwaway Postgres) runs locally before
# each ship, not in CI (see tests/README.md §CI placement).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    name: unit + component + contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      # AC-01: the production graph carries no high or critical advisory.
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      # `next build` (the ADR-0006 server-only guard) runs on every PR as the Vercel preview deploy.
      # editor-ux T3: the build gate - no route but the invoice editor ships the PDF toolkit up front.
      # Build-only placeholder settings: nothing connects to them (no DB, mail or Google call).
      - run: pnpm exec next build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-build-only-secret
          AUTH_GOOGLE_ID: ci-build-only
          AUTH_GOOGLE_SECRET: ci-build-only
          EMAIL_SERVER_HOST: localhost
          EMAIL_SERVER_PORT: '25'
          EMAIL_SERVER_USER: ci
          EMAIL_SERVER_PASSWORD: ci
          CRON_SECRET: ci-build-only
          LIMIT_KEY_SECRET: ci-build-only
      - run: pnpm check:pdf-chunks
      - run: pnpm test:unit

  integration:
    name: integration (throwaway Postgres container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      # No `.env` in CI, so the env-guard's "real .env" assertions skip cleanly (see
      # tests/integration/env-guard.test.ts) and every test talks only to the throwaway
      # container testcontainers starts.
      - run: pnpm test:integration
