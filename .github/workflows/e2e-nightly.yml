name: e2e-nightly

# editor-ux T31 (review S3): the full Playwright suite (chromium full suite, plus the webkit
# session-isolation proof) runs nightly with timing output, since the per-PR e2e job only runs
# the accessibility suite and date matrix.
# editor-ux T46 (review Q5): it runs inside the Playwright image that matches @playwright/test, the
# same one the layout baselines are drawn in (tests/e2e/README.md), so the screenshots compare
# like for like. Keep the image tag in step with the @playwright/test version in package.json.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-full:
    name: e2e (chromium full suite + webkit session-isolation, Playwright noble image)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # The app server and the database run next to the browsers: the Docker socket reaches the
      # throwaway Postgres container (testcontainers), reached back through the host gateway.
      options: --ipc=host --init --add-host=host.docker.internal:host-gateway
    env:
      CI: '1'
      E2E_TIMING: '1'
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    steps:
      - uses: actions/checkout@v4
      # The image has no Docker CLI; the e2e app server (start-app-server.mjs) probes `docker version`.
      - name: Install the Docker CLI
        env:
          DOCKER_CLI_VERSION: 27.3.1
          # sha256 of docker-27.3.1.tgz (linux x86_64 static), computed from download.docker.com.
          DOCKER_CLI_SHA256: 9b4f6fe406e50f9085ee474c451e2bb5adb119a03591f467922d3b4e2ddf31d3
        run: |
          curl -fsSL -o /tmp/docker.tgz "https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_CLI_VERSION}.tgz"
          echo "${DOCKER_CLI_SHA256}  /tmp/docker.tgz" | sha256sum -c -
          tar xzf /tmp/docker.tgz --strip-components=1 -C /usr/local/bin docker/docker
          rm /tmp/docker.tgz
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      # Browsers come with the image; no `playwright install` step.
      # Two workers come from playwright.config.ts (CI is set), as for the README's command.
      - run: pnpm test:e2e
      - name: Upload test results and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-nightly-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
