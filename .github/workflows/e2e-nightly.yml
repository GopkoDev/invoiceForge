name: e2e-nightly

# editor-ux T31 (review S3): the full Playwright suite (chromium and webkit projects) runs nightly
# with timing output, since the per-PR e2e job only runs the accessibility suite and date matrix.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  e2e-full:
    name: e2e (full suite, chromium + webkit)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
      E2E_TIMING: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm exec playwright test
