# Contract — security-patch, HTTP surface (route handlers, the Auth.js email endpoint, the tunnel,
# and the proxy boundary).
# DERIVED, not hand-written:
#   fields + constraints  ← data-model.md (LimitEvent) + the existing schema prisma/schema/*.prisma
#   error responses       ← sad.md §6 alt-branches (flows 1, 2, 6, 8, 10)
#   endpoint list + shape ← spec.md §4 US-02, US-05, US-06, US-07, US-08, US-09 / §5 AC-04, AC-11..AC-19, AC-22..AC-25
# The server-action and business-layer surface (sign-in actions, dashboard period, web-address
# rule, ActionResult) is in ./server-actions.md. Field origins + drift findings: ./api-sync-report.md.
#
# Deviations from the api-skill defaults (recorded in api-sync-report.md §C), same as the
# architecture-hardening contract:
#   - auth is the next-auth session cookie, not a Bearer header; the purge job uses the Vercel Cron bearer secret
#   - the error body is the ActionResult shape {success:false, code, error, fieldErrors?, details?} with
#     UPPER_SNAKE codes (architecture-hardening ADR-0009, ADR-0005 here), not {code,message,details?}
#   - paths stay unversioned (brownfield, same-origin consumer; Vercel Cron and the Sentry SDK call fixed paths)
openapi: 3.1.0

info:
  title: Invoice Forge — security-patch HTTP API
  version: 0.2.0
  contact:
    name: Dmytro Hopko
  description: |
    Invoice Forge is about to become a public portfolio demo, followed by an in-app AI chat.
    An audit found holes a Visitor can reach without signing in: unlimited sign-in emails,
    anonymous server actions, an open error-reporting relay, unbounded data exports, and an edge
    that treats any non-empty sign-in result as a signed-in user. This contract closes each hole
    where every caller passes through:
    - Sign-in links are limited per address and per source, inside the email provider, so the
      `/login` action and direct calls to the sign-in service share one limit.
    - "Signed in" means a verified session.
    - Anonymous mutations are refused by method at the edge.
    - Exports are limited per Freelancer in the business layer.
    - The error tunnel forwards only to the app's own project.

    **Edge boundary (AC-04, AC-18, ADR-0003).** The proxy applies `isVerifiedSession` (the
    session carries a non-empty account id). A thrown or malformed check counts as a Visitor,
    and session cookies are left untouched. Without a verified session:
    - any request whose method is not `GET`, `HEAD` or `OPTIONS` gets `401` with the
      `NotSignedIn` body, whatever its headers or body encoding. The only exceptions are the
      sign-in service (`/api/auth/*`) and the sign-in page (`/login`, where only the sign-in
      actions run; any other action posted there refuses itself with `UNAUTHORIZED`);
    - an `/api/*` `GET` outside the public allowlist gets the same `401`;
    - a private page is redirected to `/login?callbackUrl=…`;
    - a public page renders without a redirect loop (AC-06).

    The public allowlist (architecture-hardening ADR-0001) gains `/api/cron/purge-limits`
    (ADR-0007). It is a `GET`, so it is safe under ADR-0003, and it is guarded by its own
    secret. `/monitoring` stays outside the proxy matcher (ADR-0006).

    **Browser security headers (AC-20, US-08; sad.md §8).** Every response carries:
    - `Content-Security-Policy` (enforced, with `report-uri`/`report-to` pointing at the current
      environment's Sentry security endpoint);
    - `Strict-Transport-Security: max-age=63072000` (no `includeSubDomains`, no `preload`);
    - `Permissions-Policy` with camera, microphone, geolocation and payment disabled;
    - `X-XSS-Protection: 0`, `X-Content-Type-Options: nosniff`, `X-Frame-Options: DENY`,
      `Referrer-Policy: strict-origin-when-cross-origin`.

    They are served from `next.config.ts` `headers()`, replacing the `vercel.json` block. The
    exact CSP string is in sad.md §8 and is not repeated here.

tags:
  - name: auth
    description: Sign-in link requests through the sign-in service (US-05, US-06)
  - name: account
    description: Data export under the per-Freelancer limit (US-09)
  - name: ops
    description: Scheduled limit-record purge, error tunnel (US-08, spec §6 retention)

servers:
  - url: https://invoiceforge.hopko.dev
    description: Production
  - url: http://localhost:3000
    description: Local

# Global default: every operation needs a verified session. Public operations override it.
security:
  - SessionCookie: []

paths:
  /api/auth/signin/nodemailer:
    post:
      summary: Request a Sign-in link (the sign-in service's own email endpoint)
      description: |
        The Auth.js email endpoint. It is called by the `/login` action (`signInWithEmail`,
        server-actions.md) and can also be called directly. Both routes pass through the same
        provider hooks (ADR-0001), so the rules below hold however the request arrives. Google
        sign-in never reaches these hooks (AC-14).

        Order (sad.md §6 flow 1):
        1. `normalizeIdentifier` applies the address rule: ≤ 254 characters, ASCII only (AC-17).
           Identity normalization is unchanged (AC-03).
        2. Per-key locks, then the source limit (30 requests per 5 min per IPv4 address or IPv6
           /64, taken only from the platform) and the address limit (5 sent links per hour per
           folded-address digest).
        3. A limited request sends nothing and gets the same redirect as a sent one, after the
           same response floor *F* + jitter (AC-12, AC-13; spec §6 ≤ 150 ms median difference).
        4. An allowed request sends over verified TLS only (AC-16), and a `SENT` event is
           recorded only after the mail server accepts it (AC-11).

        This is the framework's form endpoint, not an app JSON API. Every outcome is a `302`.
        The `error` query parameter carries the Auth.js error type, and the `/error` page maps
        it to the plain-language message. Which type each provider failure surfaces as is beta
        API and is pinned in implement (api-sync-report OQ-2).
        Not idempotent-keyed. A retry is a new request and counts towards the source limit.
      operationId: requestSignInLink
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/SignInLinkRequest" }
            example:
              email: "user-1@example.test"
              csrfToken: "<csrf token from /api/auth/csrf>"
              callbackUrl: "/dashboard"
      responses:
        "302":
          description: |
            Every outcome is a redirect:
            - **Sent or limited (indistinguishable):** `Location: /verify-request?provider=nodemailer&type=email`,
              the "check your inbox" page (AC-11, AC-12, AC-13).
            - **Address invalid (AC-17):** `Location: /error?error=<type>`; the page says "Enter a
              valid email address." Nothing is sent or counted.
            - **Limits unavailable (AC-15):** `Location: /error?error=<type>`; the page says sign-in
              by email is temporarily unavailable, try again shortly or sign in with Google.
              Fail-closed: nothing is sent.
            - **No TLS or invalid certificate (AC-16):** `Location: /error?error=<type>`; the page
              says "could not send, try again". The failure is reported to Sentry.
            - **Missing or invalid CSRF token:** the Auth.js default (redirect to the sign-in page).
              Nothing is counted, because the hooks never run.
          headers:
            Location:
              schema: { type: string }
              examples:
                checkInbox: { value: "/verify-request?provider=nodemailer&type=email" }
                refused: { value: "/error?error=<AuthErrorType>" }

  /api/user/export:
    get:
      summary: Download all of the Freelancer's data as one JSON file, at most 3 runs per hour
      description: |
        `getAccountExport(actor)` reserves a place before reading any data (ADR-0005, sad.md §6
        flow 6):
        - The per-Freelancer lock is taken, then `EXPORT` `STARTED` events in the past hour are
          counted.
        - Under 3 → a `STARTED` event is recorded and the export runs.
        - A system-side failure flips that event to `FAILED`, which frees the place.
        - An export abandoned after the file was produced still counts (AC-24).

        Concurrent requests never run more than 3. The count is per Freelancer, never per
        network (AC-25). Success body and headers are unchanged from architecture-hardening.
      operationId: exportUserData
      tags: [account]
      responses:
        "200":
          description: The export file (AC-23)
          headers:
            Content-Disposition:
              description: 'Always `attachment; filename="Invoice Forge export YYYY-MM-DD.json"` (UTC date)'
              schema:
                type: string
                pattern: '^attachment; filename="Invoice Forge export \d{4}-\d{2}-\d{2}\.json"$'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDataExport" }
              example:
                exportDate: "2026-10-02T10:00:00.000Z"
                exportVersion: "2.0"
                user: { id: "clx0000000000000000000001", name: "Test User", email: "user-1@example.test", emailVerified: null, image: null, createdAt: "2026-01-01T00:00:00.000Z", updatedAt: "2026-01-01T00:00:00.000Z" }
                accounts: [{ provider: "google", type: "oidc", createdAt: "2026-01-01T00:00:00.000Z" }]
                emailHistory: []
                senderProfiles: []
                customers: []
                products: []
                invoices: []
        "401":
          $ref: "#/components/responses/NotSignedIn"
        "429":
          description: |
            3 exports started in the past hour that did not fail on the system's side (AC-24).
            Nothing is read or reserved. `retryAt` is when the oldest counted start leaves the
            window: `min(at) + 1 h` over this Freelancer's `STARTED` rows (data-model.md). The
            page shows "you can export again at …" in the Freelancer's local time (SCR-06).
          headers:
            Retry-After:
              description: Whole seconds until `details.retryAt`, rounded up (1–3600)
              schema: { type: integer, minimum: 1, maximum: 3600 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RateLimitedError" }
              example:
                success: false
                code: RATE_LIMITED
                error: "You've reached the export limit. You can export again later."
                details:
                  kind: RETRY_AT
                  retryAt: "2026-10-02T10:42:17.000Z"
        "500":
          description: |
            A read failed (the place is released, AC-24), the limit store is unavailable (ADR-0002:
            the export refuses, never runs unlimited), or the account vanished mid-call. Nothing
            partial is returned; details go to Sentry only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionError" }
              example:
                success: false
                code: FAILED
                error: "Your data couldn't be exported. Try again."

  /api/cron/purge-limits:
    get:
      summary: Delete every limit record older than 24 hours, across all keys (daily, Vercel Cron)
      description: |
        Called once a day by Vercel Cron (ADR-0007, sad.md §6 flow 10). The secret is compared in
        constant time before anything else.

        Sentry Crons check-ins are `in_progress` at the start and `ok` or `error` at the end. A
        missed or failed check-in alerts the app operator, which is the dead-letter equivalent.

        The job is safe to run twice: deleting rows older than 24 h needs no run key, so there is
        no `Idempotency-Key`. The scheduler does not retry. The next daily run and the bounded
        purge on every limit write catch up.
      operationId: purgeLimitRecords
      tags: [ops]
      security:
        - CronSecret: []
      responses:
        "200":
          description: Purge done
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurgeResult" }
              example:
                success: true
                data: { deleted: 128 }
        "401":
          description: The `Authorization` header is missing or does not match `CRON_SECRET`. Nothing is deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionError" }
              example:
                success: false
                code: UNAUTHORIZED
                error: "Not authorized."
        "500":
          description: |
            The delete failed. The Sentry Crons check-in is `error`, so the operator is alerted.
            No §6 branch shows this yet (api-sync-report OQ-1).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionError" }
              example:
                success: false
                code: FAILED
                error: "Purge failed."

  /monitoring:
    post:
      summary: App-owned Sentry tunnel that forwards only envelopes for the configured project
      description: |
        `POST` only (ADR-0006, sad.md §6 flow 8). The browser SDK sets `tunnel: '/monitoring'`,
        and the CSP needs only `connect-src 'self'`.

        The route reads the envelope's first line (JSON) and parses its `dsn`. It forwards to
        Sentry's envelope endpoint only when the host and the project id match
        `NEXT_PUBLIC_SENTRY_DSN` for the current environment (AC-22).

        The route is outside the proxy matcher and carries no app data. It is not rate-limited
        (spec §3 non-goal) and not idempotent-keyed: Sentry dedupes by event id. Responses carry
        no app error body, because the SDK only reads the status.
      operationId: forwardErrorEnvelope
      tags: [ops]
      security: []
      requestBody:
        required: true
        content:
          application/x-sentry-envelope:
            schema:
              type: string
              description: |
                Sentry envelope. Line 1 is the JSON header with `dsn`, and the item headers and
                payloads follow. Only the header line is parsed.
            example: |
              {"event_id":"00000000000000000000000000000000","dsn":"https://<public-key>@<org>.ingest.de.sentry.io/<project-id>","sent_at":"2026-10-02T10:00:00.000Z"}
              {"type":"event"}
              {"message":"synthetic error","level":"error"}
      responses:
        "200":
          description: Forwarded, and Sentry accepted it. Sentry's response body is passed through.
        "403":
          description: |
            The `dsn` names another host or project, is missing, or the header line is unreadable.
            Nothing is forwarded (AC-22). Empty body.
        "502":
          description: |
            The envelope was for the right project but Sentry was unreachable or answered with an
            error. Empty body, and nothing is retried server-side. No §6 branch shows this yet
            (api-sync-report OQ-1).

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Secure-authjs.session-token
      description: |
        next-auth v5 JWT session cookie (`authjs.session-token` on http://localhost). It counts as
        a verified session only when it is validly signed and carries a non-empty account id
        (`isVerifiedSession`). The Node layer also requires a live `User` row (architecture-hardening
        ADR-0002). Anything else is a Visitor, and a failed check never clears the cookie (AC-04).
    CronSecret:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer $CRON_SECRET`, sent by Vercel Cron. `CRON_SECRET` is a required setting (ADR-0008).'

  responses:
    NotSignedIn:
      description: |
        No verified session: no cookie, an invalid or account-less token, a thrown check, or a
        token whose account no longer exists (AC-04, AC-18). It is returned before any body is
        parsed. This is also the proxy's reply to any anonymous non-GET request outside
        `/api/auth/*` and `/login`, whether or not it carries the `Next-Action` header.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ActionError" }
          example:
            success: false
            code: UNAUTHORIZED
            error: "Not signed in."

  schemas:
    # ActionResult error shape (architecture-hardening ADR-0009; + RATE_LIMITED by ADR-0005).
    ActionErrorCode:
      type: string
      enum: [UNAUTHORIZED, NOT_FOUND, VALIDATION, CONFLICT, FAILED, RATE_LIMITED]
    ActionError:
      type: object
      required: [success, code, error]
      additionalProperties: false
      properties:
        success: { const: false }
        code: { $ref: "#/components/schemas/ActionErrorCode" }
        error:
          type: string
          description: Plain language. Never raw database or upstream text, never an email or network address (sad.md §8).
        fieldErrors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
        details: { $ref: "#/components/schemas/ActionErrorDetails" }
    ActionErrorDetails:
      description: Structured context. The existing kinds are listed in server-actions.md; this feature adds `RETRY_AT`.
      oneOf:
        - { $ref: "#/components/schemas/RetryAtDetails" }
        - type: object
          required: [kind]
          properties:
            kind: { enum: [TOTALS_CHANGED, HAS_INVOICES] }
    RetryAtDetails:
      type: object
      required: [kind, retryAt]
      additionalProperties: false
      properties:
        kind: { const: RETRY_AT }
        retryAt:
          type: string
          format: date-time
          description: UTC instant = oldest counted `LimitEvent.at` (EXPORT, STARTED) + 1 h (data-model.md)
    RateLimitedError:
      allOf:
        - { $ref: "#/components/schemas/ActionError" }
        - type: object
          required: [code, details]
          properties:
            code: { const: RATE_LIMITED }
            details: { $ref: "#/components/schemas/RetryAtDetails" }

    SignInLinkRequest:
      type: object
      required: [email, csrfToken]
      properties:
        email:
          type: string
          maxLength: 254
          pattern: "^[\\x21-\\x7E]+@[\\x21-\\x7E]+$"
          description: |
            ≤ 254 characters, ASCII only (AC-17). This pattern is a rough guide; the authoritative
            check is the shared `loginEmailSchema`, applied by `normalizeIdentifier`. The address
            is never stored; only its folded, keyed digest is (`LimitEvent.key`, data-model.md).
        csrfToken:
          type: string
          description: From `GET /api/auth/csrf` (Auth.js double-submit cookie)
        callbackUrl:
          type: string
          description: Same-origin path to land on after the link is opened

    PurgeResult:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success: { const: true }
        data:
          type: object
          required: [deleted]
          additionalProperties: false
          properties:
            deleted:
              type: integer
              minimum: 0
              description: Number of `LimitEvent` rows deleted (`at` < now − 24 h)

    UserDataExport:
      type: object
      description: |
        Unchanged from architecture-hardening (`exportVersion` 2.0). `LimitEvent` rows are **not**
        exported: they are short-lived security records, and address rows hold only a keyed
        digest that the Freelancer couldn't read anyway (api-sync-report D-6).
      required: [exportDate, exportVersion, user, accounts, emailHistory, senderProfiles, customers, products, invoices]
      additionalProperties: false
      properties:
        exportDate: { type: string, format: date-time }
        exportVersion: { const: "2.0" }
        user:
          type: object
          required: [id, email]
          properties:
            id: { type: string }
            name: { type: [string, "null"] }
            email: { type: string, format: email }
            emailVerified: { type: [string, "null"], format: date-time }
            image: { type: [string, "null"] }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
        accounts:
          type: array
          items:
            type: object
            required: [provider, type]
            properties:
              provider: { type: string }
              type: { type: string }
              createdAt: { type: string, format: date-time }
        emailHistory: { type: array, items: { type: object } }
        senderProfiles: { type: array, items: { type: object } }
        customers: { type: array, items: { type: object } }
        products: { type: array, items: { type: object } }
        invoices: { type: array, items: { type: object } }
