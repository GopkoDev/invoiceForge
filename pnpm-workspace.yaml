  '@babel/core@<7.29.6': ^7.29.6
  browserslist@<4.28.7: ^4.28.7
  deepmerge-ts@<8.0.0: ^8.0.0
  fast-uri@>=3.0.0 <3.1.7: ^3.1.8
  lodash@<4.18.0: ^4.18.1
  mysql2@<3.22.0: ^3.22.0
  serialize-javascript@<7.0.3: ^7.0.3
